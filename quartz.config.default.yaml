configuration:
  pageTitle: "Frank Arrigo — Digital Archive"
  pageTitleSuffix: " | frankarr wiki"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: "en-GB"
  baseUrl: "wiki.frankarr.com"
  ignorePatterns: ["private", "templates", ".obsidian"]
  defaultDateType: "created"
  theme:
    fontOrigin: "googleFonts"
    cdnCaching: true
    typography:
      header: "Schibsted Grotesk"
      body: "Source Sans Pro"
      code: "IBM Plex Mono"
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#1e3a5f"
        secondary: "#284b63"
        tertiary: "#84a98c"
        highlight: "rgba(30, 58, 95, 0.1)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a98c"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#b3aa0288"

plugins:
  - source: "github:quartz-community/obsidian-flavored-markdown"
    enabled: true
    order: 10
  - source: "github:quartz-community/github-flavored-markdown"
    enabled: true
    order: 20
  - source: "github:quartz-community/created-modified-date"
    enabled: true
    order: 30
  - source: "github:quartz-community/syntax-highlighting"
    enabled: true
    order: 40
  - source: "github:quartz-community/description"
    enabled: true
    order: 50
  - source: "github:quartz-community/crawl-links"
    enabled: true
    order: 60
  - source: "github:quartz-community/remove-drafts"
    enabled: true
    order: 70
  - source: "github:quartz-community/content-page"
    enabled: true
    order: 100
  - source: "github:quartz-community/folder-page"
    enabled: true
    order: 110
  - source: "github:quartz-community/tag-page"
    enabled: true
    order: 120
  - source: "github:quartz-community/content-index"
    enabled: true
    order: 130
  - source: "github:quartz-community/alias-redirects"
    enabled: true
    order: 140
  - source: "github:quartz-community/cname"
    enabled: true
    order: 150

layout: {}
